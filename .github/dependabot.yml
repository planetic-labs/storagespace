version: 2
multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: uv
    directory: /backend
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
  - package-ecosystem: npm
    directory: /frontend
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
  - package-ecosystem: docker
    directory: /backend
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
  - package-ecosystem: docker
    directory: /frontend
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
