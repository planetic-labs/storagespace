name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.component }} image
        run: docker build --file "${{ matrix.component }}/Dockerfile" "${{ matrix.component }}"
