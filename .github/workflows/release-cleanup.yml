name: Release Cleanup

on:
  workflow_run:
    workflows: ["Docker Build and Publish"]
    types: [completed]

concurrency:
  group: release-cleanup
  cancel-in-progress: false

jobs:
  release-history:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      MAX_RELEASES: ${{ vars.MAX_RELEASES || '10' }}
    steps:
      - name: Delete old releases, tags, and completed workflow runs
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! "$MAX_RELEASES" =~ ^[1-9][0-9]*$ ]]; then
            echo "MAX_RELEASES must be a positive integer." >&2
            exit 1
          fi

          mapfile -t old_releases < <(
            gh release list \
              --repo "$REPOSITORY" \
              --limit 1000 \
              --json tagName,isDraft,isPrerelease \
              --jq "map(select(.isDraft == false and .isPrerelease == false and (.tagName | test(\"^v[0-9]{4}[.][0-9]{2}[.][0-9]{2}(-patch[0-9]+)?$\")))) | .[${MAX_RELEASES}:] | .[].tagName"
          )

          for old_tag in "${old_releases[@]}"; do
            echo "Deleting old release and tag: $old_tag"
            gh release delete "$old_tag" --repo "$REPOSITORY" --yes --cleanup-tag
          done

          today_date="$(date -u +'%Y-%m-%d')"
          mapfile -t old_runs < <(
            gh run list \
              --repo "$REPOSITORY" \
              --limit 1000 \
              --status completed \
              --created "<$today_date" \
              --json databaseId \
              --jq '.[].databaseId'
          )

          for old_run_id in "${old_runs[@]}"; do
            echo "Deleting old completed workflow run: $old_run_id"
            gh run delete "$old_run_id" --repo "$REPOSITORY"
          done

  package-versions:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'release'
    needs: release-history
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout cleanup script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Delete old ${{ matrix.component }} image versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/cleanup_images.py --component ${{ matrix.component }} --apply
