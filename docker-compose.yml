name: storagespace-dev
services:
  backend:
    platform: linux/amd64
    build:
      context: ./backend
      platforms: [linux/amd64]
      provenance: false
      sbom: false
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    env_file:
      - .env.auth
    environment:
      APP_DATA: /data
      STORAGES_JSON: '[{"id":"test","name":"Тест","path":"/storage/test","mode":"local"},{"id":"prosvetlenie","name":"Просветление","path":"/storage/prosvetlenie","mode":"sshfs"},{"id":"personal","name":"Персональное","path":"/storage/prosvetlenie","mode":"sshfs","personal_parent":"Users"}]'
    volumes:
      - app_data:/data
      - ./storage:/storage/test:rw
      - /mnt/storagespace-prosvetlenie:/storage/prosvetlenie:rw
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  frontend:
    platform: linux/amd64
    build:
      context: ./frontend
      platforms: [linux/amd64]
      provenance: false
      sbom: false
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${APP_PORT:-50007}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging
volumes:
  app_data:
